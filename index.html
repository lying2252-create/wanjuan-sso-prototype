aceholder:'粘贴完整 IdP Metadata XML；不支持填写 URL'})+field('身份源标识（Issuer）','issuer',d.issuer,{full:true,help:'可选，留空时取元数据中的 Entity ID；已有绑定后修改需审慎'})+field('SP 私钥引用','r.sp_private_key_pem',r.sp_private_key_pem,{help:'Gateway 环境变量名，与证书引用同时填写或同时留空'})+field('SP 证书引用','r.sp_certificate_pem',r.sp_certificate_pem,{help:'不在此上传证书或私钥正文'}):field('身份源标识（Issuer）','issuer',d.issuer,{required:true,full:true,placeholder:'如 corp-ad',help:'稳定标识企业目录，已有绑定后不建议修改'})+field('目录服务器地址','s.url',s.url,{required:true,full:true,placeholder:'ldaps://ad.example.com:636',help:'使用 LDAPS，或为 LDAP 开启 StartTLS'})+`<div class="field full"><label class="checkrow"><input name="s.start_tls" type="checkbox" ${s.start_tls?'checked':''}>启用 StartTLS</label><div class="help">ldaps:// 不可同时启用 StartTLS</div></div>`+field('服务账号 DN','s.bind_dn',s.bind_dn,{placeholder:'cn=svc,dc=example,dc=com'})+field('服务账号密码引用','r.bind_password',r.bind_password,{placeholder:'CORP_LDAP_BIND_PASSWORD',help:'与服务账号 DN 配套填写，仅填写环境变量名'})+field('用户搜索根路径（Base DN）','s.base_dn',s.base_dn,{required:true,full:true,placeholder:'dc=example,dc=com'})+field('用户查询条件','s.user_filter',s.user_filter,{required:true,full:true,placeholder:'(sAMAccountName={username})',help:'必须保留 {username} 占位符'})+field('用户名属性','s.username_attr',s.username_attr||'sAMAccountName',{help:'AD 默认 sAMAccountName；OpenLDAP 建议 uid'})+field('稳定身份属性','s.subject_attr',s.subject_attr||'objectGUID',{help:'AD 默认 objectGUID；OpenLDAP 建议 entryUUID'})+field('邮箱属性','s.email_attr',s.email_attr,{placeholder:'mail'})+field('姓名属性','s.name_attr',s.name_attr,{placeholder:'displayName'})+field('用户组属性','s.group_attr',s.group_attr,{placeholder:'memberOf',help:'仅用于展示，不自动映射角色'})+field('信任 CA 引用','r.ca_pem',r.ca_pem,{placeholder:'CORP_LDAP_CA_PEM'})}</div><div id="sourceError"></div>${alertBox('密钥由运维配置在 Gateway 中，此处只填写环境变量引用名称。配置测试不替代真实用户登录验收。')}${ann('登录源编码、协议创建后只读。保存后可测试；PUT 提交完整配置。前台回跳白名单由部署配置维护，与企业平台回调地址分开。')}</form>`,`${btn('取消','askClose()')}${btn('保存配置','saveSource()','primary')}`,true);sourceForm.initial=J function collectSource(){const f=document.getElementById('sourceForm');if(!f)return draft;let d={...draft,settings:{},secretRefs:{}};for(const e of f.elements){if(!e.name)continue;const v=e.type==='checkbox'?e.checked:e.value.trim();if(e.name.startsWith('s.'))d.settings[e.name.slice(2)]=v;else if(e.name.startsWith('r.'))d.secretRefs[e.name.slice(2)]=v;else d[e.name]=v}d.settings.scopes=d.protocol==='oidc'?Array.from(new Set(['openid',...(d.settings.scopes||'').split(/\s+/).filter(Boolean)])).join(' '):undefined;return d}
function sourceDirty(){return JSON.stringify(collectSource())!==sourceForm.initial}
function chooseProtocol(p){if(sourceDirty()&&!confirm('切换认证协议将清空当前协议配置，确定继续吗？'))return;draft=collectSource();draft.protocol=p;draft.settings={...(p==='oidc'?{scopes:'openid profile email'}:p==='ldap'?{username_attr:'sAMAccountName',subject_attr:'objectGUID'}:{})};draft.secretRefs={};draft.issuer='';sourceForm()}
function configError(d){if(!d.name||!d.code)return '请填写登录源名称和编码';if(!/^[a-z][a-z0-9_-]{1,63}$/.test(d.code)||d.code==='local')return '登录源编码格式不正确，或使用了保留编码 local';if(db.sources.some(s=>s.code===d.code&&s.code!==editingCode))return '登录源编码已存在，请修改';const s=d.settings,r=d.secretRefs;const https=v=>{try{return new URL(v).protocol==='https:'}catch{return false}};const ref=v=>!v||/^[A-Za-z_][A-Za-z0-9_]*$/.test(v);if(Object.values(r).some(v=>!ref(v)))return '密钥引用应为环境变量名，请勿填写密钥正文';if(d.protocol==='oidc'){if(!https(d.issuer)||!s.client_id||!https(s.redirect_url))return '请填写 HTTPS 认证平台地址、应用标识和 HTTPS 回调地址';if(!s.redirect_url.includes(`/auth/sso/${d.code}/callback`))return '企业认证回调地址应指向此登录源的 Gateway /auth/sso/编码/callback'}if(d.protocol==='saml'){if(!s.entity_id||!https(s.root_url)||!s.idp_metadata_xml)return '请填写 SP 标识、HTTPS 根地址和企业身份平台元数据';const xml=new DOMParser().parseFromString(s.idp_metadata_xml,'application/xml');if(xml.querySelector('parsererror')||!['EntityDescriptor','EntitiesDescriptor'].includes(xml.documentElement.localName))return '请输入有效的 SAML IdP Metadata XML，而不是元数据 URL';if(!!r.sp_private_key_pem!==!!r.sp_certificate_pem)return 'SP 私钥引用与证书引用必须同时填写或同时留空'}if(d.protocol==='ldap'){if(!d.issuer||!s.url||!s.base_dn||!s.user_filter)return '请填写身份源标识、目录地址、搜索根路径和查询条件';if(!s.user_filter.includes('{username}'))return '用户查询条件必须包含 {username} 占位符';if(s.url.startsWith('ldaps://')&&s.start_tls)return 'LDAPS 不可同时启用 StartTLS';if(!s.url.startsWith('ldaps://')&&!(s.url.startsWith('ldap://')&&s.start_tls))return '请使用 LDAPS，或为 LDAP 启用 StartTLS';if(!!s.bind_dn!==!!r.bind_password)return '服务账号 DN 与服务账号密码引用必须同时填写或同时留空'}return ''}
function saveSource(){const d=collectSource(),f=document.getElementById('sourceForm');if(!f.reportValidity())return;const err=configError(d);if(err){document.getElementById('sourceError').innerHTML=alertBox(esc(err),'error');return}const old=source(editingCode);if(old&&old.issuer!==d.issuer&&!confirm('修改身份源标识可能影响已有企业身份绑定。确认保存吗？'))return;d.updated=stamp();d.loaded=d.enabled;if(old)db.sources[db.sources.indexOf(old)]=d;else db.sources.unshift(d);save();closeLayer();render();modal('配置已保存',`${alertBox(d.enabled?'修改已保存，新的登录将使用当前配置。建议重新测试并完成真实用户联调。':'配置已按停用状态保存。测试通过后可启用前台入口。','success')}<div class="descgrid"><dt>登录源名称</dt><dd>${esc(d.name)}</dd><dt>认证协议</dt><dd>${pLabel(d.protocol)}</dd><dt>当前状态</dt><dd>${d.enabled?'已启用':'已停用'}</dd></div>`,`${btn('返回列表','closeLayer()')}${btn('测试已保存配置',`testSource('${d.code}')`,'primary')}`)}
function testSource(code){const s=source(code);modal('测试登录源配置',`<div class="center"><div class="testcircle ${state.testFail?'fail':''}">${state.testFail?'!':'✓'}</div><h3>${state.testFail?'配置测试未通过':'配置测试通过'}</h3><p>${esc(s.name)} · ${pLabel(s.protocol)}</p></div>${alertBox(state.testFail?'密钥引用不可用，请联系运维检查 Gateway 环境配置。':s.protocol==='oidc'?'已完成 OIDC 发现与配置构建。':s.protocol==='saml'?'已完成元数据检查与认证请求构建。':'已完成 TLS 连接及配置的服务账号绑定。',state.testFail?'error':'success')}<div class="descgrid"><dt>检查时间</dt><dd>${stamp()}（演示）</dd><dt>测试范围</dt><dd>仅测试已保存的配置，不验证真实用户、换票和审批链路。</dd></div>`,`${btn('关闭','closeLayer()')}${state.testFail?btn('修改配置',`editSource('${code}')`,'primary'):!s.enabled?btn('启用登录源',`enableSource('${code}')`,'primary'):''}`)}
function toggleSource(code){const s=source(code);modal(s.enabled?'停用登录源':'启用登录源',`<p style="font-size:13px;color:#777d89">${s.enabled?'停用后，前台将隐藏此登录入口，新的企业认证不可发起。已有万卷会话不会自动退出。':'启用后，前台将展示“'+esc(s.name)+'”入口。请先确认配置已保存并完成测试。'}</p>`,`${btn('取消','closeLayer()')}${btn(s.enabled?'确认停用':'确认启用',`enableSource('${code}',${!s.enabled})`,'primary')}`)}
function enableSource(code,enabled=true){if(enabled&&state.testFail){modal('启用失败',alertBox('登录源构建失败：密钥引用不可用，请联系运维检查。当前仍保持停用。','error'));return}const s=source(code);s.enabled=enabled;s.loaded=enabled;s.updated=stamp();save();closeLayer();render();toast(enabled?'登录源已启用，前台入口已更新':'登录源已停用，前台入口已隐藏')}
function samlInfo(code){const s=source(code),root=(s.settings.root_url||'https://auth.example.com').replace(/\/$/,'');modal('SAML 接入信息',`<div class="field"><label>ACS 回调地址</label><div class="inline"><input readonly value="${esc(root+'/auth/sso/'+code+'/callback')}">${btn(I('copy'),`copySaml('${code}')`,'small')}</div></div><div class="line"></div><div class="field"><label>SP 元数据地址</label><input readonly value="${esc(root+'/auth/sso/'+code+'/metadata')}"><div class="help">${s.enabled?'当前登录源已启用，可在真实环境获取 SP 元数据。':'需先启用并加载登录源，才能获取 SP 元数据。'}</div></div>`,`${btn('关闭','closeLayer()')}${btn('查看 SP 元数据',s.enabled?"previewMetadata()":"void(0)",'small')}`);if(!s.enabled)document.querySelector('.modal .dfoot button:last-child').disabled=true}
function copySaml(code){const s=source(code);copyText((s.settings.root_url||'').replace(/\/$/,'')+'/auth/sso/'+code+'/callback')}
function previewMetadata(){modal('SP 元数据',alertBox('原型不连接 Gateway。实施时由已启用登录源的 /metadata 接口返回实际 SP 元数据。'))}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('已复制')}catch{toast('请选中文本后手动复制')}}
function approvalResults(){
const q=state.reqQ.trim().toLowerCase();
const rows=db.requests.filter(x=>(state.apTab==='pending'?x.status==='pending':state.apTab==='done'?x.status!=='pending':false)&&(!state.reqSource||x.source===state.reqSource)&&(!state.reqStatus||x.status===state.reqStatus)&&(!q||[x.name,x.username].some(v=>String(v??'').toLowerCase().includes(q))));
return `<div class="tablewrap"><table><thead><tr><th>审批信息</th><th>申请人 / 企业账号</th><th>企业邮箱</th><th>登录源</th><th>申请类型</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td><a onclick="openApproval('${r.id}')">SSO 账号开通</a><div class="sub">${r.id}</div></td><td>${esc(r.name||'未提供')}<div class="sub">${esc(r.username||'未提供')}</div></td><td style="color:#8d929c;font-size:12px">${esc(r.email||'未提供')}</td><td>${esc(source(r.source)?.name||r.source)}<div class="sub">${pLabel(source(r.source)?.protocol)||'—'}</div></td><td>账号开通申请</td><td>${tag(r.status)}</td><td style="font-size:12px;color:#9297a1">${r.created}</td><td>${btn(r.status==='pending'?'审批':'查看详情',`openApproval('${r.id}')`,'text')}</td></tr>`).join('')}</tbody></table>${!rows.length?`<div class="empty">${I('approval')}<div>${state.apTab==='mine'?'暂无本人发起的 SSO 申请':state.reqSource||state.reqStatus||state.reqQ.trim()?'未找到符合条件的申请，请调整筛选条件':'暂无开通申请'}</div></div>`:''}</div><div class="pagination">共 ${rows.length} 条记录　10 条 / 页　 ‹　<span class="pagenum">1</span>　›</div>`;
}
function filterApprovalQuery(value){state.reqQ=value;const results=document.getElementById('approvalResults');if(results)results.innerHTML=approvalResults()}
function approvalPage(){
const statuses=state.apTab==='pending'?['pending']:state.apTab==='done'?['approved','rejected','expired']:['pending','approved','rejected','expired'];
return `<div class="heading" style="margin-bottom:4px"><div class="seg">${[['pending','待我审批'],['mine','我发起的'],['done','已审批']].map(([v,t])=>btn(t,`state.apTab='${v}';state.reqStatus='';render()`,state.apTab===v?'active':'')).join('')}</div><span class="spacer"></span>${btn(I('refresh')+' 刷新','render();toast("列表已刷新")','small')}</div><div class="subtabs">${btn('应用审批',"state.apType='app';render()",state.apType==='app'?'active':'')}${btn('SSO 账号开通 <b class="counter">'+db.requests.filter(x=>x.status==='pending').length+'</b>',"state.apType='sso';render()",state.apType==='sso'?'active':'')}</div>${state.apType==='app'?appApproval():`${state.apTab==='mine'?alertBox('SSO 开通申请由首次企业认证自动生成，统一在“待我审批”和“已审批”中处理。'):alertBox('首次企业认证成功后自动生成申请。审批时配置所属部门和角色，通过后自动创建万卷账号。')}<div class="filters"><label class="filterlabel" for="approval-source">登录源</label><select id="approval-source" aria-label="审批登录源筛选" onchange="state.reqSource=this.value;render()"><option value="">全部登录源</option>${db.sources.map(s=>`<option value="${esc(s.code)}" ${state.reqSource===s.code?'selected':''}>${esc(s.name)}</option>`).join('')}</select><label class="filterlabel" for="approval-status">状态</label><select id="approval-status" aria-label="审批状态筛选" onchange="state.reqStatus=this.value;render()"><option value="">全部状态</option>${statuses.map(s=>`<option value="${s}" ${state.reqStatus===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select><input aria-label="申请人或企业账号搜索" placeholder="搜索申请人 / 企业账号" value="${esc(state.reqQ)}" oninput="filterApprovalQuery(this.value)">${btn('重置',"state.reqSource='';state.reqStatus='';state.reqQ='';render()")}</div><div id="approvalResults" style="display:flex;flex-direction:column;flex:1">${approvalResults()}</div>${ann('SSO 申请支持登录源、状态与申请人 / 企业账号组合筛选，关键词按包含匹配并忽略大小写和首尾空格。待我审批仅显示待审批；已审批包含已通过、已拒绝、已过期；切换页签清空状态条件，保留登录源和关键词。原型在本地过滤，正式实现需后端在分页前完成过滤。')}`}`;
}
function appApproval(){return `<div class="filters"><input placeholder="工作流 / 智能体 / 技能" aria-label="应用审批搜索" disabled><input placeholder="请输入申请人" disabled><select disabled><option>请选择资源类型</option></select></div><table><thead><tr><th>审批信息</th><th>资源类型</th><th>申请人</th><th>申请类型</th><th>状态</th><th>发布渠道</th><th>操作</th></tr></thead><tbody><tr><td>制度问答助手</td><td>智能体</td><td>产品体验账号</td><td>上架申请</td><td>${tag('pending')}</td><td>专家中心</td><td><span style="color:#b4b2be">沿用原流程</span></td></tr></tbody></table><div class="footerhint">现有应用审批保留；本原型聚焦新增的 SSO 账号开通流程。</div>`}
let currentRequest=null;const roles=['普通用户','应用创建者','部门管理员'],depts=['产品部','研发部','市场部','综合管理部'];
function identityBox(r){return `<div class="identitybox"><div class="person"><span class="avatar">${I('user')}</span>${esc(r.name||'企业用户')}${tag(r.status)}</div><dl class="descgrid"><dt>企业账号</dt><dd>${esc(r.username||'未提供')}</dd><dt>企业邮箱</dt><dd>${esc(r.email||'未提供')}</dd><dt>登录源</dt><dd>${esc(source(r.source)?.name||r.source)}　<span class="protocol">${pLabel(source(r.source)?.protocol)}</span></dd><dt>申请编号</dt><dd>${r.id}</dd><dt>提交时间</dt><dd>${r.created}</dd></dl><details><summary>更多企业身份信息</summary><dl class="descgrid"><dt>稳定身份标识</dt><dd>${esc(r.subject)}</dd><dt>身份平台标识</dt><dd>${esc(r.issuer||'未提供')}</dd><dt>企业用户组</dt><dd>${esc(r.groups?.join('、')||'未提供')}<div class="help">仅展示，不自动映射为部门或角色</div></dd><dt>更新时间</dt><dd>${r.updated}</dd></dl></details></div>`}
function accountForm(u={},approval=false){return `<div class="fields">${field('万卷用户名','username',u.username||'',{required:true,max:30,readonly:!approval,help:approval?'由企业账号预填，需管理员确认；不自动合并同名账号':''})}${field('显示名称','name',u.name||'',{required:true,max:30})}${field('所属部门','dept',u.dept||'',{required:true,select:[['','请选择部门'],...depts]})}<div class="field"><label>岗位</label><div class="multiselect">${['产品经理','研发工程师'].map(p=>`<label class="checkrow"><input name="post" type="checkbox" value="${p}" ${u.posts?.includes(p)?'checked':''}>${p}</label>`).join('')}</div></div><div class="field full"><label class="required">角色</label><div class="multiselect">${roles.map(r=>`<label class="checkrow"><input name="role" type="checkbox" value="${r}" ${u.roles?.includes(r)?'checked':''}>${r}</label>`).join('')}</div><div class="help">至少选择一个角色；企业认证不自动授予万卷业务权限</div></div>${field('邮箱','email',u.email||'',{type:'email',max:50})}${field('手机号','phone',u.phone||'',{max:11,placeholder:'选填'})}<div class="field full"><label>账号有效期</label><label class="checkrow"><input name="permanent" type="checkbox" ${!u.expires?'checked':''} onchange="this.closest('.field').querySelector('input[type=datetime-local]').disabled=this.checked">永久有效</label><input name="expires" type="datetime-local" value="${esc(u.expires||'')}" ${!u.expires?'disabled':''}><div class="help">显示和提交时间统一按北京时间（UTC+8）；指定时间须晚于当前时间</div></div>${field(approval?'审批备注':'备注','reason',u.reason||'',{area:true,full:true,max:512,placeholder:'选填，最多 512 字'})}</div>`}
function openApproval(id){currentRequest=id;draft=null;const r=db.requests.find(x=>x.id===id),u=db.users.find(x=>x.id===r.userId);const approve=r.status==='pending',recover=r.status==='approved'&&!u;drawer(approve?'审批开通账号':'开通申请详情',`${identityBox(r)}${approve||recover?`<div class="sectiontitle">万卷账号与权限</div>${alertBox('通过后自动创建账号并绑定企业身份，仅开通网页端。桌面使用权在用户管理中单独分配。')}<form id="approvalForm" onsubmit="event.preventDefault();approveRequest()">${accountForm({...r,username:r.username,name:r.name},true)}<div id="approvalError"></div></form>${ann('部门、角色在现有接口中为可选；本产品稿按最新会议要求设为必填，需后端补一致校验。拒绝按钮为产品设计，需新增外部拒绝接口后上线。')}`:`<div class="sectiontitle">处理信息</div><dl class="descgrid"><dt>处理备注</dt><dd>${esc(r.reason||'未填写')}</dd><dt>关联万卷用户</dt><dd>${esc(u?u.name+'（'+u.username+'）':r.userId||'尚未创建')}</dd></dl>${u?alertBox('账号已创建。请通知用户重新登录；系统不主动发送审批结果通知。','success'):''}`}`,approve?`${btn('拒绝',`rejectRequest('${id}')`,'danger')}<span class="spacer"></span>${btn('取消','closeLayer()')}${btn('通过并开通','approveRequest()','primary')}`:recover?`${btn('关闭','closeLayer()')}${btn('重试恢复开通','approveRequest()','primary')}`:`${btn('关闭','closeLayer()')}${u?btn('查看关联用户',`viewLinkedUser('${u.id}')`,'primary'):''}${['rejected','expired'].includes(r.status)?btn('重新打开',`reopenRequest('${id}')`,'primary'):''}`,true)}
function accountValues(form){const f=new FormData(form);return {username:String(f.get('username')||'').trim(),name:String(f.get('name')||'').trim(),dept:f.get('dept'),roles:f.getAll('role'),posts:f.getAll('post'),email:f.get('email'),phone:f.get('phone'),expires:f.get('permanent')?'':f.get('expires'),reason:f.get('reason')}}
function accountError(u){if(!u.username||u.username.length>30||!u.name||u.name.length>30)return '请填写 1–30 字符的用户名和显示名称';if(!u.dept)return '请选择所属部门';if(!u.roles.length)return '请至少选择一个角色';if(u.phone&&!/^\d{1,11}$/.test(u.phone))return '手机号仅支持数字，最多 11 位';if(u.expires){const time=Date.parse(u.expires+':00+08:00');if(!Number.isFinite(time)||time<=Date.now())return '账号有效期必须晚于当前北京时间'}else if(!document.querySelector('input[name=permanent]').checked)return '请选择账号有效期或勾选永久有效';return ''}
function approveRequest(){const form=document.getElementById('approvalForm');if(!form.reportValidity())return;let u=accountValues(form);const r=db.requests.find(x=>x.id===currentRequest);const error=accountError(u)||(db.users.some(x=>x.username===u.username&&x.id!==r.userId)?'该用户名已被使用，请修改万卷用户名。':'')||(state.seatFull?'网页账号名额已满，暂无法开通。请释放名额或联系管理员扩容。':'');if(error){document.getElementById('approvalError').innerHTML=alertBox(esc(error),'error');return}if(state.timeout){document.getElementById('approvalError').innerHTML=alertBox('开通结果暂未确认，请刷新申请状态后重试。原申请和表单已保留；请勿新建申请。','warn')+btn('刷新申请状态','refreshRequestStatus()','small');return}const b=document.querySelector('.dfoot button.primary');b.disabled=true;b.textContent='正在开通…';setTimeout(()=>{let existing=db.users.find(x=>x.id===r.userId);if(!existing){u={...u,id:'u-'+(typeof crypto.randomUUID==='function'?crypto.randomUUID().slice(0,8):Date.now().toString(36)),source:r.source,subject:r.subject,enabled:true,desktop:false};db.users.push(u);r.userId=u.id}r.status='approved';r.updated=stamp();r.reason=u.reason||'';save();closeLayer();render();toast('账号已开通，请通知用户重新登录')},450)}
function refreshRequestStatus(){const r=db.requests.find(x=>x.id===currentRequest);document.getElementById('approvalError').innerHTML=alertBox(`当前申请 ${r.id}：${statusLabel(r.status)}。${r.status==='pending'?'确认未开通后，可按同一申请重试。':''}`,'warn')+btn('重试原申请',"state.timeout=false;approveRequest()",'small')}
function rejectRequest(id){modal('拒绝开通申请',`${alertBox('产品设计：此操作依赖新增 Backend 外部拒绝接口，当前原型仅模拟状态变更。','warn')}<div class="field"><label class="required">拒绝原因</label><textarea id="rejectReason" maxlength="512" placeholder="请填写拒绝原因，最多 512 字"></textarea></div><div id="rejectError"></div>`,`${btn('返回审批',`openApproval('${id}')`)}${btn('确认拒绝',`confirmReject('${id}')`,'danger')}`)}
function confirmReject(id){const reason=document.getElementById('rejectReason').value.trim();if(!reason){document.getElementById('rejectError').innerHTML='<div class="errtext">请填写拒绝原因</div>';return}Object.assign(db.requests.find(x=>x.id===id),{status:'rejected',reason,updated:stamp()});save();closeLayer();render();toast('已拒绝该开通申请（模拟）')}
function reopenRequest(id){modal('重新打开申请',`${alertBox('重新打开后申请回到“待我审批”，仍需管理员配置权限并审批开通。')}<div class="field"><label>重新打开原因</label><textarea id="reopenReason" maxlength="512" placeholder="选填，最多 512 字"></textarea></div>`,`${btn('取消',`openApproval('${id}')`)}${btn('确认重新打开',`confirmReopen('${id}')`,'primary')}`)}
function confirmReopen(id){const r=db.requests.find(x=>x.id===id);r.status='pending';r.reason=document.getElementById('reopenReason').value.trim();r.updated=stamp();save();closeLayer();state.apTab='pending';render();toast('申请已重新打开，等待审批')}
function viewLinkedUser(id){go('admin','users');editUser(id)}

function saveUser(id){const f=document.getElementById('userForm');if(!f.reportValidity())return;const u=accountValues(f),e=accountError(u);if(e){document.getElementById('userError').innerHTML=alertBox(esc(e),'error');return}Object.assign(db.users.find(x=>x.id===id),u,{enabled:f.elements.enabled.checked,desktop:f.elements.desktop.checked});save();closeLayer();render();toast('用户配置已保存')}
function loginPage(){const list=state.sourceLoad==='empty'?[]:db.sources.filter(s=>s.enabled&&s.loaded);return `<main class="loginpage"><section class="loginhero">${logo()}<div class="heroheadline">让 AI 融入工作<br>成为你的<em>企业级伙伴</em></div><div class="herodesc">便捷接入企业资源，安全协作每一项任务<br>从理解需求，到交付结果</div><div class="orbital"><div class="orbit"></div><div class="orbit two"></div><div class="orb">Q</div><div class="herochip a">✦　企业知识</div><div class="herochip b">◇　可信协作</div></div><div class="herofoot">智答万卷　·　企业级 AI 工作平台</div></section><section class="loginright"><div class="logincard"><h1>欢迎登录万卷</h1><div class="intro">连接企业智能，开启高效工作</div><form onsubmit="event.preventDefault();localLogin()"><div class="field"><label>账号</label><input name="localAccount" placeholder="请输入账号" required autocomplete="off"></div><div class="field"><label>密码</label><input name="localPassword" type="password" placeholder="请输入密码" required autocomplete="off"></div><button class="primary fullbtn" type="submit">登录</button></form>${state.sourceLoad==='fail'?`<div class="divider"><span>企业登录</span></div>${alertBox('企业登录方式加载失败，请重试。','warn')}${btn('重新加载',"state.sourceLoad='normal';render()",'fullbtn')}`:list.length?`<div class="divider"><span>企业登录</span></div>${list.map(s=>`<button class="providerbtn" onclick="startLogin('${s.code}')"><span class="typeicon">${I(s.protocol==='ldap'?'users':s.protocol==='saml'?'shield':'globe')}</span><span class="pname">${esc(s.name)}</span><span class="protocol">${pLabel(s.protocol)}</span>${I('arrow')}</button>`).join('')}`:''}<div class="loginfoot">${list.length?'使用企业账号登录，无需单独注册万卷账号':'安全接入 · 企业级 AI 伙伴'}</div>${ann('入口仅取已启用且已加载的登录源；名称使用 display_name，协议标识帮助用户识别。OIDC/SAML 点击后跳转；LDAP/AD 进入站内凭据页。本地登录仅作保留区域示意。')}</div></section></main>`}

function makeRequest(name){let r=db.requests.find(x=>x.source===state.loginSource&&x.username===name);if(!r){r={id:'SSO-'+Date.now(),source:state.loginSource,username:name,name:({zhangsan:'张三',lihua:'李华',wangwu:'王五'})[name]||name,email:name+'@example.com',subject:'demo-'+state.loginSource+'-'+name,issuer:source(state.loginSource)?.issuer||'企业 IdP Entity ID',groups:[],status:'pending',reason:'',created:stamp(),updated:stamp()};db.requests.unshift(r)}else r.updated=stamp();save();return r}
function finishAuth(name){state.demoUser=name;const forced={incomplete:'incomplete',expired:'expired',service:'service',norole:'norole',disabled:'disabled',accountExpired:'accountExpired',license:'license',reopen:'reopen'}[state.scenario];if(forced){showResult(forced);return}const s=source(state.loginSource);if(!s?.enabled||!s.loaded){showResult('unavailable');return}const r=db.requests.find(x=>x.source===s.code&&x.username===name);const u=db.users.find(x=>x.source===s.code&&((r&&x.id===r.userId)||x.username===name));if(u){if(!u.enabled){showResult('disabled');return}if(u.expires&&Date.parse(u.expires+':00+08:00')<=Date.now()){showResult('accountExpired');return}if(!u.roles?.length||!u.dept){showResult('norole');return}state.user=u;go('workspace');return}if(r&&['rejected','expired'].includes(r.status)){showResult('reopen');return}if(r?.status==='approved'){showResult('service');return}makeRequest(name);showResult('pending')}

function renderDemo(){document.getElementById('demo').innerHTML=state.demoOpen?`<aside class="demopanel"><div class="demohead">${I('settings')}演示场景控制<span class="spacer"></span>${btn(I('x'),'toggleDemo()','icon')}</div><div class="demobody"><div class="field"><label>企业测试账号</label><input aria-label="企业测试账号" value="${esc(state.demoUser)}" onchange="state.demoUser=this.value.trim()||'zhangsan';if(state.view==='idp'||state.view==='ldap')render()"></div><div class="field"><label>登录结果模拟</label><select aria-label="登录结果模拟" onchange="state.scenario=this.value">${[['normal','正常流程 · 根据审批数据判断'],['norole','已建号，但未配置业务权限'],['wrong','LDAP 账号密码错误'],['reopen','申请已拒绝或过期'],['incomplete','企业认证未完成'],['expired','登录事务 / 票据失效'],['service','认证服务异常'],['disabled','万卷账号已停用'],['accountExpired','万卷账号已过期'],['license','系统授权不可用']].map(([v,t])=>`<option value="${v}" ${state.scenario===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>前台登录源列表</label><select aria-label="前台登录源列表" onchange="state.sourceLoad=this.value;if(state.view==='login')render()">${[['normal','正常 · 跟随后台配置'],['empty','无可用登录源'],['fail','加载失败']].map(([v,t])=>`<option value="${v}" ${state.sourceLoad===v?'selected':''}>${t}</option>`).join('')}</select></div>${[['testFail','配置测试 / 启用失败'],['seatFull','网页账号名额已满'],['timeout','审批结果未知 / 超时'],['annot','显示产品批注']].map(([k,t])=>`<label class="checkrow" style="margin:8px 0"><input type="checkbox" ${state[k]?'checked':''} onchange="state.${k}=this.checked;${k==='annot'?'render()':''}">${t}</label>`).join('')}<div class="line" style="margin:12px 0"></div><div class="inline">${btn('重置演示数据','resetDemo()','small')}${btn('去审批张三',"state.apType='sso';state.apTab='pending';go('admin','approval')",'small')}</div><p>张三 / 李华：初始待审批；王五：已开通。后台审批后，用同一测试账号重新登录验证。所有字段仅为虚拟样例。</p></div></aside>`:''}

function specPage(){return `<main class="spec" style="margin-top:46px"><div class="spec-head"><span class="badge purple">产品需求设计 · V1.0 · 2026.10.20</span><h1 style="margin-top:13px">SSO 登录与账号开通</h1><p>依据开发交互说明、10 月 20 日会议纪要及现有万卷页面整理</p></div><div class="specgrid"><nav class="specnav">${[['s1','01 产品目标与范围'],['s2','02 信息架构'],['s3','03 登录与权限'],['s4','04 登录源配置'],['s5','05 审批与建号'],['s6','06 状态与异常'],['s7','07 开发对齐项'],['s8','08 验收清单']].map(([id,t])=>`<a href="#${id}">${t}</a>`).join('')}</nav><div class="specbody">${specContent()}</div></div></main>`}
function specContent(){return `
<section class="specsection" id="s1"><h2>01 产品目标与范围</h2><p>企业用户通过已有身份登录万卷，首次认证自动进入账号开通审批。管理员在一个位置配置登录源，在现有审批中心配置用户部门与角色，通过后系统自动建号并绑定企业身份。</p><div class="flow"><span>管理员配置登录源</span><b>→</b><span>用户企业认证</span><b>→</b><span>首次自动申请</span><b>→</b><span>管理员配置权限</span><b>→</b><span>自动建号后重新登录</span></div><table><tr><th>本期范围</th><th>暂不纳入</th></tr><tr><td>OIDC、SAML、LDAP/AD；登录源新增、编辑、测试、启停；首次自动申请；人工审批、建号、重新打开；账号权限维护与异常提示</td><td>自动审批、审批结果主动通知、新增 SSO 操作审计页面、组织同步、用户组自动映射、已有账号自动合并、身份源删除、企业统一登出</td></tr></table><p>三个类型均允许配置多个登录源。BS 与 CS 共享认证和审批业务规则；桌面仍采用浏览器授权与独立席位校验，不等同于两端传输流程完全相同。</p></section>
<section class="specsection" id="s2"><h2>02 信息架构</h2><table><tr><th>页面位置</th><th>新增内容</th><th>交互约定</th></tr><tr><td>系统管理 → 登录源管理</td><td>登录源列表、配置抽屉、测试结果、SAML 接入信息</td><td>延续白底、紫色主按钮、筛选栏、表格与右侧抽屉</td></tr><tr><td>审批管理 → 审批中心</td><td>新增“SSO 账号开通”业务分类</td><td>保留待我审批 / 我发起的 / 已审批页签；应用审批不变；SSO 使用登录源、状态、申请人 / 企业账号组合筛选，不使用资源类型或发布渠道筛选</td></tr><tr><td>前台登录页</td><td>企业登录入口、LDAP 表单与结果页</td><td>本地登录区域保留；仅展示已启用且已加载的登录源</td></tr><tr><td>系统管理 → 用户管理</td><td>账号来源 SSO、关联账号与权限维护</td><td>企业平台负责密码；桌面使用权单独管理</td></tr></table><p>SSO 申请由系统自动发起，不伪造为当前管理员的“我发起的”。已拒绝和已过期记录暂纳入“已审批”业务分类供重新打开；若原审批中心不允许此语义，落地时将该页签改为“已处理”。</p></section>
<section class="specsection" id="s3"><h2>03 登录与权限判定</h2><ol><li>进入登录页先加载认证配置及可用登录源。无登录源时隐藏企业登录区域；加载失败显示重试，不视为空列表。</li><li>入口显示管理员设置的名称，并附协议标识。系统根据登录源 protocol 自动分流，不通过账号或密码猜测协议。</li><li>OIDC / SAML 整页跳转企业认证平台；LDAP / AD 进入万卷企业账号密码表单，凭据经 Gateway 验证。</li><li>认证成功且企业身份未绑定：生成或复用同一身份的待审批申请，不创建可用业务账号，不进入系统。</li><li>待审批提示主文案为<strong>“请联系管理员完成权限配置”</strong>；说明“企业身份验证成功，账号开通申请已自动提交。管理员审批并完成权限配置后，请重新登录。”</li><li>已建号但没有可用业务权限：沿用上述主文案，提示管理员配置部门和角色，不重复生成开通申请。此分支需后端提供明确权限判定及稳定业务错误码。</li><li>已绑定、账号可用、有权限：换取业务会话后加载用户和真实业务菜单。审批通过后的下一次登录才能进入系统，不自动登录或自动通知。</li></ol><p>重复认证以稳定企业身份（登录源 / issuer / subject）识别，不以邮箱或姓名自动合并。原型虚拟账号用于模拟稳定身份；生产中不能按邮箱匹配建号。</p><p>用户退出仅结束万卷会话；不承诺退出企业平台或其他应用。LDAP 密码不写 URL、日志或持久存储。</p></section>
<section class="specsection" id="s4"><h2>04 登录源配置</h2><h3>通用规则</h3><p>名称必填，最长 191 字符并与 Gateway 校验对齐；编码为 2–64 位，小写字母开头，后续支持小写字母、数字、下划线和短横线；local 为保留值。编码与协议创建后不可改；标识 issuer 已绑定用户后变更需二次确认。新增默认停用，保存后测试，再由管理员启用。已启用源编辑保存会影响后续登录，需明确提示。</p><table><tr><th>类型</th><th>必填字段</th><th>可选与条件字段</th></tr><tr><td>OIDC</td><td>认证平台地址 issuer、Client ID、企业认证回调地址 redirect_url</td><td>Scopes，始终包含 openid；应用密钥引用按企业客户端类型填写</td></tr><tr><td>SAML</td><td>SP Entity ID、Gateway 对外根地址、完整 IdP Metadata XML</td><td>issuer 可空；SP 私钥引用和证书引用同时填或同时空；不接收 metadata URL</td></tr><tr><td>LDAP / AD</td><td>issuer、目录服务器地址、Base DN、含 {username} 的用户查询条件</td><td>StartTLS；服务账号 DN 与绑定密码引用配套；用户名、稳定身份、邮箱、姓名、用户组属性与 CA 引用</td></tr></table><p>LDAPS 与 StartTLS 互斥；ldap:// 必须启用 StartTLS。AD 默认用户名属性 sAMAccountName、身份属性 objectGUID；OpenLDAP 建议 uid 和 entryUUID。邮箱 / 姓名 / 用户组无代码默认值，需要时显式填写。</p><p>密钥字段只输入 Gateway 环境变量名，不上传或保存明文 Secret。测试针对已保存版本；未保存不可测试。测试结果在弹窗展示，不增加持久化“最近测试”列。</p><p>OIDC 测试仅发现与配置构建；SAML 测试元数据与请求构建；LDAP 测试 TLS 与服务账号绑定。测试成功不代表真实用户登录、换票和审批闭环已成功。</p><p>SAML 提供复制 ACS 和查看 SP 元数据入口；获取元数据要求登录源已启用并加载。停用后前台入口隐藏，但已有业务会话不强制退出。管理 enabled=true 不等于真实服务可用。</p></section>
<section class="specsection" id="s5"><h2>05 审批与自动建号</h2><p>SSO 列表展示申请编号、姓名 / 企业账号、企业邮箱、登录源、申请类型、状态、提交时间、操作。支持登录源、状态和申请人 / 企业账号模糊搜索，三项条件取交集。关键词同时匹配姓名与企业账号，按包含匹配，忽略大小写和首尾空格，输入后即时更新列表；空关键词不限制。登录源包含已停用配置。待我审批仅提供待审批；已审批提供已通过、已拒绝、已过期。切换页签清空状态，保留登录源和关键词；重置清空三项条件，仍停留当前页签。无匹配结果展示提示，列表数量随结果更新。正式接口需新增关键词筛选能力，在后端分页前执行过滤；接口分页使用 offset=(页码−1)×limit，limit 最大 200，筛选变更回到第一页。不新增时间范围筛选。</p><p>详情展示企业 subject、issuer、groups、更新时间、处理备注、关联用户 ID。企业字段只读，未提供时不虚构；用户组不自动转为权限。不展示未提供的审批人和历史时间线。</p><table><tr><th>审批字段</th><th>规则</th></tr><tr><td>万卷用户名 / 显示名称</td><td>必填，1–30 字符；可从企业信息预填；同名冲突须修改，不自动绑定既有账号</td></tr><tr><td>所属部门 / 角色</td><td>产品规则必填；角色至少一项，必须选择可用对象；现有接口可选，需同步收紧后端校验</td></tr><tr><td>岗位 / 邮箱 / 手机号</td><td>岗位多选可空；邮箱最多 50 字符；手机号最多 11 字符</td></tr><tr><td>账号有效期</td><td>默认永久；指定日期时间必须晚于当前；界面北京时间，后端确认统一序列化契约</td></tr><tr><td>审批备注</td><td>选填，最多 512 字符；性别字段可沿用未知默认值，无需主流程呈现</td></tr></table><p>点击“通过并开通”后按钮禁用，仅审批接口完成且账号创建成功才提示“账号已开通，请通知用户重新登录”。成功刷新申请及用户列表，建立企业身份绑定。审批不设置本地密码，不分配桌面使用权。</p><p>拒绝需填写原因，仅管理端展示；当前外部拒绝接口缺失，原型已标记待补。已拒绝 / 已过期申请由管理员重新打开，可填原因，然后重新审批；用户重复登录不自动重开。</p><p>审批超时保留表单和申请编号，先刷新状态，再用同一申请幂等重试。仅 status=approved 不足以承诺账号可用；需核验关联账号，异常提供原申请恢复。</p><p>未审批不占网页名额；V1 网页不限额，V2 按授权容量校验。审批开通时检查并占用网页名额。停用、到期和网络异常不释放名额；删除完成后才释放。</p></section>
<section class="specsection" id="s6"><h2>06 结果状态与异常</h2><table><tr><th>场景</th><th>用户提示 / 处理</th></tr><tr><td>首次待审批 / 已建号无权限</td><td>请联系管理员完成权限配置；两分支说明不同，已建号不重复申请</td></tr><tr><td>已拒绝或已过期</td><td>请联系管理员重新打开申请；当前申请人接口不能稳定拆分两种状态</td></tr><tr><td>LDAP 凭据错误</td><td>企业账号或密码错误，请重新输入；保留账号，清空密码</td></tr><tr><td>身份源停用 / 未加载</td><td>该企业登录方式暂不可用，请联系管理员；返回登录页刷新入口</td></tr><tr><td>企业认证拒绝 / 未完成</td><td>企业认证未完成，请重新登录；不精确承诺为“取消”</td></tr><tr><td>事务 / 票据过期或使用过</td><td>本次登录已失效，请重新登录；重新建事务，不重复换旧票据</td></tr><tr><td>账号停用 / 账号到期 / License 不可用</td><td>分别提示账号不可用、账号已过期、系统授权不可用，请联系管理员；不进入业务页</td></tr><tr><td>用户名冲突 / 部门角色不可用</td><td>表单内提示更正；保留其他字段</td></tr><tr><td>网页名额已满</td><td>网页账号名额已满，暂无法开通。请释放名额或联系管理员扩容；不得报成功</td></tr><tr><td>测试失败 / 审批结果未知</td><td>区分测试失败与保存失败；结果未知时保留原申请，先刷新后重试</td></tr></table></section>
<section class="specsection" id="s7"><h2>07 开发对齐与上线前置</h2><table><tr><th>级别</th><th>需补齐或确认</th><th>验收要求</th></tr><tr><td>P0</td><td>OIDC / SAML 异常回跳</td><td>待审批及失败返回可读前端结果页；不可信事务使用安全可读错误页，不停在 Gateway JSON</td></tr><tr><td>P0</td><td>稳定业务错误码与无业务权限分支</td><td>同为 403 时仍可区分待审批、需重开、已建号无权限；加载实际菜单前校验账号与权限，不误建号</td></tr><tr><td>P0 产品新增</td><td>部门 / 角色改为审批必填</td><td>后端校验与前端一致；不能空角色通过后导致不可用账号</td></tr><tr><td>P1</td><td>拒绝外部接口与权限初始化</td><td>通过 Backend 权限校验调用，不直接访问 Gateway 内部接口；接口完成后开放拒绝</td></tr><tr><td>P1 产品新增</td><td>SSO 申请关键词检索</td><td>后端支持姓名 / 企业账号包含匹配，与登录源、状态组合过滤后再分页；原型本地过滤仅用于演示</td></tr><tr><td>P1</td><td>契约与真实环境联调</td><td>字段、时区、菜单、License、Gateway 地址、回调白名单、三类测试身份源与 BS / CS 联调齐备</td></tr></table><p>通过已有 GET providers 的 protocol 分流。管理入口走 Backend /api/v1/system/access-control，保存完整配置；前端不调用 Gateway /internal/*。管理权限：idp:list、idp:config、provision:list、provision:approve，均带 system:access: 前缀；按钮按权限显示，后端独立校验。</p><p>OIDC / SAML 用 S256 PKCE。Gateway→前台回跳白名单与 IdP→Gateway 协议回调分开；一次性票据及时从地址栏移除，不等同业务 Token。换票即使 HTTP 200，也必须校验业务成功字段。票据和事务时长以服务端响应 / 部署为准。</p><p>原型展示完整目标体验；后端已实现标识来自开发说明，不代表前端已上线。拒绝、无权限稳定识别、异常回跳以及必填规则变更均应列入开发排期。会议提及内网自动审批未成为本次明确需求，一期不加入自动审批开关。</p></section>
<section class="specsection" id="s8"><h2>08 产品验收清单</h2><ol><li>SSO 审批支持登录源、状态与申请人 / 企业账号组合筛选；中文姓名、账号片段、大小写、首尾空格、无匹配、重置及切换页签正确。</li><li>无登录源、多个登录源、加载失败三个状态正确；停用和启用即时影响下一次登录入口。</li><li>三类配置字段完整且动态切换；编码重复、保留值、TLS 冲突、引用配对、XML 格式与必填校验正确。</li><li>每类身份源完成“首次认证 → 自动申请 → 部门角色配置 → 审批建号 → 用户重新登录成功”。</li><li>重复首次认证只复用一份申请；同名已有账号不误绑定；已建号无权限不重新建号。</li><li>审批超时可按同一申请重试；名额不足、账号冲突、角色失效不显示开通成功。</li><li>拒绝和过期只能由管理员重开；审批后用户无主动通知，不展示假进度。</li><li>停用、到期、License 异常、票据失效均阻断业务访问；HTTP 200 的换票业务失败也不能进入系统。</li><li>SSO 用户不提供本地密码重置；桌面授权独立，网页开通成功不代表桌面可用；无管理权限不可配置或审批。</li></ol><p class="noprint">原型演示路径：登录源管理 → 预览登录页 → 企业统一登录 → 完成企业认证（张三）→ 等待配置 → 后台审批中心 → SSO 账号开通 → 配置部门和角色 → 通过并开通 → 回登录页用同一企业身份登录。</p></section>`}
